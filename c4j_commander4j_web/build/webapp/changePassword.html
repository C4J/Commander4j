<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>Change Password</title>
	<link href="style/commander.e0e6f20f.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div class="container">
		<h1>Change Password</h1>
		<h2 id="siteDescription"></h2>
		<br>
		<form id="changePassword" name="changePassword" onsubmit="return false;">
			<div class="divTable fields">
				<div class="divTableBody">
					<div class="divTableRow">
						<div class="divTableCell"><label for="username">Username :</label></div>
						<div class="divTableCell"><input type="text" id="username" name="username" readonly></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell"><label for="password">Current :</label></div>
						<div class="divTableCell"><input type="password" id="password" name="password" autocomplete="current-password"></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell"><label for="newPassword1">New :</label></div>
						<div class="divTableCell"><input type="password" id="newPassword1" name="newPassword1" autocomplete="new-password"></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell"><label for="newPassword2">Verify :</label></div>
						<div class="divTableCell"><input type="password" id="newPassword2" name="newPassword2" autocomplete="new-password"></div>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label id="message" style="color:black; background-color:yellow"></label>
			</div>
			<div class="form-group"><br></div>
			<div class="button-group">
				<button type="button" class="cancel-btn" id="buttonCancel">Back</button>
				<button type="submit" class="submit-btn" id="buttonSubmit">Submit</button>
			</div>
		</form>
	</div>
	<script src="js/c4j.deda09e2.js"></script>
	<script>
		c4j.page(function () {
			c4j.get('api/session').then(function (r) {
				if (!r.ok) { return; }
				c4j.text('siteDescription', r.data.siteDescription);
				c4j.setValue('username', r.data.username);
				c4j.focus('password');
			});
			c4j.get('api/lang?keys=web_Submit,btn_Back').then(function (r) {
				if (r.ok) { c4j.text('buttonSubmit', r.data.text.web_Submit || 'Submit'); c4j.text('buttonCancel', r.data.text.btn_Back || 'Back'); }
			});
			c4j.onSubmit('changePassword', function () {
				c4j.put('api/session/password', {
					password: c4j.value('password'),
					newPassword1: c4j.value('newPassword1'),
					newPassword2: c4j.value('newPassword2')
				}).then(function (r) {
					if (!r.ok) { c4j.focus('password'); }
				});
			});
			document.getElementById('buttonCancel').addEventListener('click', function () { c4j.put('api/session/password', { cancel: true }); });
		});
	</script>
</body>
</html>
