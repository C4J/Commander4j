<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>Login</title>
	<link href="style/commander.e0e6f20f.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div class="container">
		<h1 id="siteDescription"></h1>
		<br>
		<form id="login" name="login" onsubmit="return false;">
			<div class="form-group">
				<img src="images/user-login-icon.gif" width="60" style="display:block; margin-left:auto; margin-right:auto;">
			</div>
			<div class="form-group"><br></div>
			<div class="divTable fields">
				<div class="divTableBody">
					<div class="divTableRow">
						<div class="divTableCell"><label for="username">Username :</label></div>
						<div class="divTableCell"><input type="text" id="username" name="username" autocomplete="username"></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell"><label for="password">Password :</label></div>
						<div class="divTableCell"><input type="password" id="password" name="password" autocomplete="current-password"></div>
					</div>
				</div>
			</div>
			<div class="form-group"><br></div>
			<div class="form-group">
				<label id="message" style="color:black; background-color:yellow"></label>
			</div>
			<div class="form-group"><br></div>
			<div class="button-group">
				<button type="button" class="cancel-btn" id="buttonCancel">Back</button>
				<button type="submit" class="submit-btn" id="buttonSubmit">Login</button>
			</div>
		</form>
	</div>
	<script src="js/c4j.deda09e2.js"></script>
	<script>
		c4j.page(function () {
			c4j.get('api/session').then(function (r) {
				if (!r.ok) { return; }
				c4j.text('siteDescription', r.data.siteDescription);
				c4j.setValue('username', r.data.username);
				c4j.setValue('password', '');
				c4j.focus('username');
			});
			c4j.onSubmit('login', function () {
				c4j.put('api/session/login', { username: c4j.value('username'), password: c4j.value('password') }).then(function (r) {
					if (!r.ok && !r.next) { c4j.setValue('password', ''); c4j.focus('username'); }
				});
			});
			document.getElementById('buttonCancel').addEventListener('click', function () { c4j.del('api/session'); });
		});
	</script>
</body>
</html>
