<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>Setup Panel</title>
	<link href="style/commander.31ed74db.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div class="container">
		<h1 id="title">Setup Panel</h1>
		<form id="qmTrayEdit" name="qmTrayEdit" onsubmit="return false;">
			<h2 id="subtitle">Tray</h2>
			<div class="divTable kv">
				<div class="divTableBody">
					<div class="divTableRow">
						<div class="divTableCell"><label for="description" id="lbl_Description">Description :</label></div>
						<div class="divTableCell"><input type="text" id="description" name="description" autocomplete="off" maxlength="100"></div>
					</div>
					<div class="divTableRow"><div class="divTableCell"><label id="lbl_Created">Created</label></div><div class="divTableCell"><span class="value" id="created"></span></div></div>
					<div class="divTableRow"><div class="divTableCell"><label id="lbl_Updated">Updated</label></div><div class="divTableCell"><span class="value" id="updated"></span></div></div>
				</div>
			</div>
			<div class="form-group">
				<label id="message" style="color:black; background-color:yellow"></label>
			</div>
			<div class="button-group">
				<button type="button" class="cancel-btn" id="buttonBack">Back</button>
				<button type="button" class="regular-btn" id="buttonSamples">Samples</button>
				<button type="submit" class="submit-btn" id="buttonSave">Save</button>
			</div>
		</form>
	</div>
	<script src="js/c4j.73c36a46.js"></script>
	<script>
		// c4j_web_WS trayEdit.html: Save updates the description; Samples saves then opens the scan page
		var PANEL = 'Panel', TRAY = 'Tray';
		c4j.page(function () {
			c4j.lang(['mod_FRM_QM_PANEL_SETUP', 'lbl_Panel', 'lbl_Tray', 'lbl_Description', 'lbl_Created', 'lbl_Updated', 'btn_Back', 'btn_Save', 'btn_Samples']).then(function (t) {
				if (t.lbl_Panel) { PANEL = t.lbl_Panel; } if (t.lbl_Tray) { TRAY = t.lbl_Tray; }
				c4j.label('title', t.mod_FRM_QM_PANEL_SETUP);
				c4j.label('lbl_Description', t.lbl_Description ? t.lbl_Description + ' :' : ''); c4j.label('lbl_Created', t.lbl_Created); c4j.label('lbl_Updated', t.lbl_Updated);
				c4j.label('buttonBack', t.btn_Back); c4j.label('buttonSave', t.btn_Save); c4j.label('buttonSamples', t.btn_Samples);
				load();
			});
			function load() {
				c4j.get('api/qm/setup/tray').then(function (r) {
					if (!r.ok) { return; }
					var d = r.data;
					c4j.text('subtitle', d.plant + ' [' + PANEL + ' ' + d.panelID + '] - ' + TRAY + ' ' + d.traySequence);
					c4j.setValue('description', d.description);
					c4j.text('created', d.created); c4j.text('updated', d.updated);
					c4j.focus('description');
				});
			}
			function save(action) { return c4j.put('api/qm/setup/tray', { description: c4j.value('description'), action: action }); }
			c4j.onSubmit('qmTrayEdit', function () { save('save').then(function (r) { if (r.ok) { load(); } }); });
			document.getElementById('buttonSamples').addEventListener('click', function () { save('samples'); });
			document.getElementById('buttonBack').addEventListener('click', function () { c4j.goTo('qmTrays'); });
		});
	</script>
</body>
</html>
