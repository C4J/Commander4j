<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>Barcode Validate</title>
	<link href="style/commander.e0e6f20f.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div class="container">
		<form id="validateDUResult" name="validateDUResult" onsubmit="return false;">
			<h1 id="title">Barcode Validate</h1>
			<div class="divTable">
				<div class="divTableBody">
					<div class="divTableRow">
						<div class="divTableCell" align="right"><label id="lbl_Process_Order">Process Order</label></div>
						<div class="divTableCell"><label><span style="color:blue" id="validateOrder"></span></label></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell" align="right"><label id="lbl_Material">Material</label></div>
						<div class="divTableCell"><label><span style="color:blue" id="material"></span></label></div>
					</div>
				</div>
			</div>
			<label><span style="font-size:0.9em;color:blue" id="materialDescription"></span></label>
			<div class="form-group"><br></div>
			<div class="divTable">
				<div class="divTableHeading">
					<div class="divTableRow">
						<div class="divTableHead" align="right"><label><span style="text-decoration: underline;">Source</span></label></div>
						<div class="divTableHead" align="left"><label><span style="text-decoration: underline;">GTIN</span></label></div>
						<div class="divTableHead" align="right"><label><span style="text-decoration: underline;">Variant</span></label></div>
					</div>
					<div class="divTableRow"><div class="divTableHead"><label><br></label></div></div>
				</div>
				<div class="divTableBody">
					<div class="divTableRow">
						<div class="divTableCell" align="right"><label>Order</label></div>
						<div class="divTableCell"><label><span id="materialDU_EAN"></span></label></div>
						<div class="divTableCell"><label><span id="materialDU_VARIANT"></span></label></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell" align="right"><label>Pallet</label></div>
						<div class="divTableCell"><label><span id="palletGTIN"></span></label></div>
						<div class="divTableCell"><label><span id="palletVariant"></span></label></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell" align="right"><label>Case/Tray</label></div>
						<div class="divTableCell"><label><span id="trayGTIN"></span></label></div>
						<div class="divTableCell"><label><span id="trayVariant"></span></label></div>
					</div>
				</div>
			</div>
			<div class="form-group"><br></div>
			<div class="form-group">
				<label id="message" style="color:black; background-color:yellow"></label>
			</div>
			<div class="form-group"><br></div>
			<div class="button-group">
				<button type="button" id="exitButton" name="exitButton" class="cancel-btn">Back</button>
			</div>
		</form>
	</div>
	<script src="js/c4j.deda09e2.js"></script>
	<script>
		c4j.page(function () {
			c4j.get('api/lang?keys=web_Barcode_Validate,lbl_Process_Order,lbl_Material,btn_Back').then(function (r) {
				if (r.ok && r.data && r.data.text && r.data.text.btn_Back) { c4j.text('exitButton', r.data.text.btn_Back); }
				if (!r.ok) { return; }
				c4j.text('title', r.data.text.web_Barcode_Validate);
				c4j.text('lbl_Process_Order', r.data.text.lbl_Process_Order);
				c4j.text('lbl_Material', r.data.text.lbl_Material);
			});
			c4j.get('api/pallets/state').then(function (r) {
				if (!r.ok) { return; }
				var d = r.data;
				['validateOrder', 'material', 'materialDescription', 'materialDU_EAN', 'materialDU_VARIANT', 'palletGTIN', 'palletVariant', 'trayGTIN', 'trayVariant'].forEach(function (k) { c4j.text(k, d[k]); });
				document.getElementById('materialDU_EAN').style.color = 'green';
				document.getElementById('materialDU_VARIANT').style.color = 'green';
				document.getElementById('palletGTIN').style.color = d.palletGTINColor;
				document.getElementById('palletVariant').style.color = d.palletVariantColor;
				document.getElementById('trayGTIN').style.color = d.trayGTINColor;
				document.getElementById('trayVariant').style.color = d.trayVariantColor;
				c4j.message(d.resultMessage);
				c4j.focus('exitButton');
			});
			document.getElementById('exitButton').addEventListener('click', function () { c4j.goTo('validateDUPallet'); });
		});
	</script>
</body>
</html>
