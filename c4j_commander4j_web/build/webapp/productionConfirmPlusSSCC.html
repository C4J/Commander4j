<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>Production Confirm +</title>
	<link href="style/commander.31ed74db.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div class="container">
		<h1 id="title">Production Confirm +</h1>
		<form id="productionConfirmPlusSSCC" name="productionConfirmPlusSSCC" onsubmit="return false;">
			<div class="form-group">
				<img src="images/pallet_sscc.gif" width="50%" style="display:block; margin-left:auto; margin-right:auto;max-width:300px">
			</div>
			<div class="form-group"><br></div>
			<div class="divTable fields">
				<div class="divTableBody">
					<div class="divTableRow">
						<div class="divTableCell" align="right"><label for="sscc">SSCC :</label></div>
						<div class="divTableCell"><input type="text" id="sscc" name="sscc" autocomplete="off"></div>
					</div>
					<div class="divTableRow">
						<div class="divTableCell"></div>
						<div class="divTableCell" align="center">
							<label>Confirmed : <span id="confirmCount"></span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="form-group"><br></div>
			<div class="form-group">
				<label id="message" style="color:black; background-color:yellow"></label>
			</div>
			<div class="button-group">
				<button type="button" class="cancel-btn" id="buttonCancel">Back</button>
				<button type="submit" class="submit-btn" id="buttonSubmit">Submit</button>
			</div>
		</form>
	</div>
	<script src="js/c4j.73c36a46.js"></script>
	<script>
		c4j.page(function () {
			c4j.get('api/lang?keys=mod_FRM_PAL_PROD_CONFIRM+,btn_Back').then(function (r) {
				if (r.ok && r.data && r.data.text && r.data.text.btn_Back) { c4j.text('buttonCancel', r.data.text.btn_Back); }
				if (r.ok && r.data.text['mod_FRM_PAL_PROD_CONFIRM+']) { c4j.text('title', r.data.text['mod_FRM_PAL_PROD_CONFIRM+']); }
			});
			c4j.get('api/pallets/state').then(function (r) {
				if (r.ok) { c4j.text('confirmCount', r.data.confirmCount); }
				c4j.focus('sscc');
			});
			c4j.onSubmit('productionConfirmPlusSSCC', function () {
				c4j.put('api/pallets/confirmPlus/sscc', { sscc: c4j.value('sscc') }).then(function (r) {
					if (r.busy) { return; }
					c4j.setValue('sscc', '');
					if (r.data && r.data.confirmCount !== undefined) { c4j.text('confirmCount', r.data.confirmCount); }
					if (!r.next) { c4j.focus('sscc'); }
				});
			});
			document.getElementById('buttonCancel').addEventListener('click', function () { c4j.put('api/pallets/confirmPlus/cancel'); });
		});
	</script>
</body>
</html>
